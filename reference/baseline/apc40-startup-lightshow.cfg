; Akai APC40 ORIGINAL — full-panel ~10-second startup lightshow, v4
; MIDIMonster v0.6 / Windows / Lua backend required.
;
; Includes: 8x5 clip grid, Clip Stop, channel strips, Master, Stop All Clips,
; Scene Launch, Clip/Track through Metronome row, transport, Track Control rings,
; and Device Control rings.
;
; Place this file and apc40-startup-lightshow-v4.lua beside midimonster.exe.
; Close MIDI-OX, Bome, SONAR, Ableton, and other MIDI applications first.
;
; Start:
;   midimonster.exe apc40-startup-lightshow-v4.cfg
;
; Output-only. It clears all LEDs at completion.

[backend winmidi]
list = on

[winmidi apc40]
write = Akai APC40

[lua show]
script = apc40-startup-lightshow.lua

[map]
; Clip Launch grid: notes 53–57. Channels 0–7 are Tracks 1–8.
show.pad_t1_r1 > apc40.ch0.note53
show.pad_t1_r2 > apc40.ch0.note54
show.pad_t1_r3 > apc40.ch0.note55
show.pad_t1_r4 > apc40.ch0.note56
show.pad_t1_r5 > apc40.ch0.note57
show.pad_t2_r1 > apc40.ch1.note53
show.pad_t2_r2 > apc40.ch1.note54
